<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#1c1c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#16161b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="88" y="178" fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-3">lgmon</text>
    <text x="92" y="232" fill="#c9c9d1" font-size="28" font-weight="500">Brightness, volume and inputs for LG webOS monitors,</text>
    <text x="92" y="270" fill="#c9c9d1" font-size="28" font-weight="500">from your Mac's keyboard. No DDC needed.</text>
    <text x="92" y="330" fill="#7d7d88" font-size="18" font-weight="500" letter-spacing="1.5">MACOS  ·  WEBOS 22+  ·  WI-FI / ETHERNET</text>
  </g>

  <!-- monitor -->
  <g transform="translate(860,48)">
    <rect x="0" y="0" width="330" height="200" rx="14" fill="#08080a" stroke="#3a3a44" stroke-width="2"/>
    <rect x="10" y="10" width="310" height="180" rx="6" fill="url(#screen)"/>
    <path d="M150 200 L180 200 L188 242 L142 242 Z" fill="#26262e"/>
    <rect x="110" y="240" width="110" height="8" rx="4" fill="#30303a"/>

    <!-- brightness panel, like the macOS one -->
    <g transform="translate(40,62)">
      <rect width="250" height="56" rx="16" fill="#2c2c33" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="14" y="23" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="12" font-weight="700">LG SMARTGAME+</text>
      <rect x="38" y="35" width="174" height="4" rx="2" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="38" y="35" width="110" height="4" rx="2" fill="#ffffff"/>
      <g fill="#9a9aa4" stroke="#9a9aa4" stroke-width="1.3" stroke-linecap="round">
        <circle cx="22" cy="37" r="2.4"/>
        <path d="M22 31.5v-1.6M22 42.5v1.6M16.5 37h-1.6M27.5 37h1.6M18.1 33.1l-1.1-1.1M25.9 40.9l1.1 1.1M18.1 40.9l-1.1 1.1M25.9 33.1l1.1-1.1"/>
        <circle cx="228" cy="37" r="3.2"/>
        <path d="M228 30v-2.2M228 44v2.2M221 37h-2.2M235 37h2.2M223 32l-1.5-1.5M233 42l1.5 1.5M223 42l-1.5 1.5M233 32l1.5-1.5"/>
      </g>
    </g>
  </g>

  <!-- keys -->
  <g transform="translate(905,350)" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="0" y="-30" width="54" height="44" rx="9" fill="#24242b" stroke="#3a3a44"/>
    <text x="27" y="0">⌥</text>
    <text x="74" y="-1" fill="#7d7d88" font-size="18">+</text>
    <rect x="94" y="-30" width="54" height="44" rx="9" fill="#24242b" stroke="#3a3a44"/>
    <path d="M110 -12h6l7-6v16l-7-6h-6z" fill="#ffffff"/>
    <path d="M127 -14a6 6 0 0 1 0 8M131 -17a10 10 0 0 1 0 14" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="196" y="-1" fill="#7d7d88" font-size="18">or</text>
    <rect x="232" y="-30" width="96" height="44" rx="9" fill="#24242b" stroke="#3a3a44"/>
    <text x="280" y="0" font-size="18">⌃⌥ ↑↓</text>
  </g>
</svg>
